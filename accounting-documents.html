        .accounting-table {

            font-size: var(--font-size-sm);

        .accounting-table th,

            border: 1px solid var(--color-table-border);
            padding: var(--spacing-2);
        }

        .accounting-table th {
            background-color: var(--color-base-secondary);
            font-weight: var(--font-weight-medium);
            text-align: center;
        }

        .accounting-table td.numeric {
            text-align: right;
            font-family: monospace;
        }

        .accounting-table tr.total-row {
            background-color: var(--color-base-tertiary);
            font-weight: bold;

                ]
            },

                headers: ['積立資産の種類', '期首残高', '当期増加額', '当期減少額', '期末残高'],

                ]
            },
            'table8': {
                title: '就労支援事業明細書（多機能事業所様式）（表8）',
                headers: ['科目', '合計', 'Aサービス', 'Bサービス'],
                rows: [
                    { name: '売上高', type: 'data', current: 3000000, col1: 2000000, col2: 1000000 },
                    { name: '製造費用', type: 'data', current: 1500000, col1: 1000000, col2: 500000 },
                    { name: '販売費及び一般管理費', type: 'data', current: 1000000, col1: 600000, col2: 400000 },
                    { name: '事業活動損益', type: 'total', current: 500000, col1: 400000, col2: 100000 }
                ]
            }
        };

        function formatCurrency(num) {
            if (num === undefined || num === null) return '-';
            return new Intl.NumberFormat('ja-JP').format(num);
        }

        function switchDocument(docId, btn) {
            // Update Tab Active State
            document.querySelectorAll('.tab-link').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');

            renderDocument(docId);
        }

        function renderDocument(docId) {
            const container = document.getElementById('document-container');
            const data = documents[docId];
            if (!data) return;

            let html = `<h3>${data.title}</h3>`;
            html += `<div class="accounting-table-container"><table class="accounting-table">`;

            // Header
            html += `<thead><tr>`;
            data.headers.forEach(h => {
                html += `<th>${h}</th>`;
            });
            html += `</tr></thead><tbody>`;

            // Rows
            data.rows.forEach(row => {
                const trClass = row.type.includes('total') ? 'total-row' : '';
                const baseStyle = row.type === 'header' ? 'background-color: #EEE; font-weight: bold;' :
                    row.type === 'header-sub' ? 'padding-left: 20px; font-weight: bold;' : '';

                html += `<tr class="${trClass}" style="${baseStyle}">`;
                html += `<td>${row.name}</td>`;

                // Logic to handle different column structures based on doc type roughly
                // This is a simple generic render for the mock
                if (data.headers.length === 4) {
                    // Assume Standard Calc: Current, Previous, Diff
                    if (row.type === 'header' || row.type === 'header-sub') {
                        html += `<td></td><td></td><td></td>`;
                    } else {
                        const diff = (row.current || 0) - (row.previous || 0);
                        html += `<td class="numeric">${formatCurrency(row.current)}</td>`;
                        html += `<td class="numeric">${formatCurrency(row.previous)}</td>`;
                        html += `<td class="numeric">${formatCurrency(diff)}</td>`;
                    }
                } else if (data.headers.length === 5) {
                    // Check if headers has '合計' (Total + 3 cols) or '積立' (Start, Inc, Dec, End)
                    if (row.type === 'header' || row.type === 'header-sub') {
                        html += `<td></td><td></td><td></td><td></td>`;
                    } else {
                        if (row.current !== undefined) {
                            // Breakdown Table (Total, A, B, C)
                            html += `<td class="numeric">${formatCurrency(row.current)}</td>`;
                            html += `<td class="numeric">${formatCurrency(row.col1)}</td>`;
                            html += `<td class="numeric">${formatCurrency(row.col2)}</td>`;
                            html += `<td class="numeric">${formatCurrency(row.col3)}</td>`;
                        } else {
                            // Reserve Table (Start, Inc, Dec, End)
                            html += `<td class="numeric">${formatCurrency(row.col1)}</td>`;
                            html += `<td class="numeric">${formatCurrency(row.col2)}</td>`;
                            html += `<td class="numeric">${formatCurrency(row.col3)}</td>`;
                            html += `<td class="numeric">${formatCurrency(row.col4)}</td>`;
                        }
                    }
                }

                html += `</tr>`;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Init Sidebar Toggle
            document.getElementById('sidebar-toggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
            });

            // Initial render
            const initialTab = document.querySelector('.tab-link.active');
            if (initialTab) {
                switchDocument('annex1', initialTab);
            }
        });

        // Sidebar Accordion Logic (Ported)
        function toggleAccordion(e, id) {
            e.preventDefault();
            const content = document.getElementById(id);
            const parent = e.currentTarget;

            // Toggle
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                parent.classList.remove('open');
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
                parent.classList.add('open');
            }
        }
    </script>
