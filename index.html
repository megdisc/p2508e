<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | p2508e</title>
    <link rel="stylesheet" href="globals.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--palette-126) 0%, var(--palette-066) 100%);
            font-family: var(--font-family-base);
            overflow: hidden;
            position: relative;
        }

        /* Ambient background shapes for premium feel */
        .ambient-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }

        .shape-1 {
            width: 500px;
            height: 500px;
            background-color: var(--palette-FC0);
            top: -150px;
            right: -100px;
            animation: float 20s infinite ease-in-out;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background-color: var(--palette-066);
            bottom: -100px;
            left: -50px;
            animation: float 15s infinite ease-in-out reverse;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(50px, 50px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--palette-126);
            margin-bottom: 2rem;
            letter-spacing: 0.05em;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid transparent;
            background: #f0f2f5;
            border-radius: 12px;
            font-size: 1rem;
            color: var(--palette-333);
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            background: #fff;
            border-color: var(--palette-126);
            box-shadow: 0 0 0 4px rgba(17, 34, 102, 0.1);
        }

        .form-input::placeholder {
            color: #aaa;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--palette-126);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(17, 34, 102, 0.3);
            margin-top: 1rem;
        }

        .login-btn:hover {
            background: var(--palette-066);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 102, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .forgot-password {
            margin-top: 1.5rem;
            display: block;
            color: var(--palette-666);
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: var(--palette-126);
        }

        .brand-logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--palette-126);
        }
    </style>
</head>

<body>
    <div class="ambient-shape shape-1"></div>
    <div class="ambient-shape shape-2"></div>

    <div class="login-card">
        <div class="brand-logo">⌘</div>
        <h1 class="login-title">LOGIN</h1>
        <form action="top.html">
            <div class="form-group">
                <input type="text" class="form-input" placeholder="メールアドレス">
            </div>
            <div class="form-group">
                <input type="password" class="form-input" placeholder="パスワード">
            </div>
            <button type="submit" class="login-btn">ログイン</button>
        </form>
        <a href="#" class="forgot-password">パスワードをお忘れですか？</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.login-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';

            setTimeout(() => {
                card.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>

</html>
